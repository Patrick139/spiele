<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lernen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3dc">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<style>
  :root {
    --papier: #fff3dc; --papier2: #ffe9c2; --karte: #fffdf7; --tinte: #3b2f22; --sanft: #7a6a55; --rand: #ead9b8;
    --gelb: #ffd25c; --gelb-d: #e0a91f; --blau: #8fdcf7; --blau-d: #3fa9d6; --gruen: #b4ec8c; --gruen-d: #6cbc45;
    --rot: #ff8a80; --gut: #5cc96b; --gut-d: #3b9c48;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--papier); color: var(--tinte);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  body { background: radial-gradient(ellipse at 20% 0%, #fff9ec, transparent 60%), radial-gradient(ellipse at 90% 100%, var(--papier2), transparent 60%), var(--papier); }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  .weg { display: none !important; }
  .schirm { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: max(10px, env(safe-area-inset-top)) 16px max(52px, env(safe-area-inset-bottom)); overflow-y: auto; }
  .buchst-svg { display: block; height: 100%; width: auto; overflow: visible; }

  /* ---- Startseite ---- */
  #hub { justify-content: center; }
  h1 { margin: 0; font-size: clamp(38px, 11vw, 64px); font-weight: 900; letter-spacing: .02em; }
  h1 span:nth-child(1) { color: #ff6b6b } h1 span:nth-child(2) { color: #f0a500 } h1 span:nth-child(3) { color: #3fa9d6 }
  h1 span:nth-child(4) { color: #5cb85c } h1 span:nth-child(5) { color: #b07cff } h1 span:nth-child(6) { color: #ff8f3d }
  .sprachen { display: flex; gap: 10px; }
  .spr { border: 3px solid var(--rand); background: var(--karte); border-radius: 999px; padding: 10px 18px; font-size: 17px; font-weight: 800; color: var(--sanft); }
  .spr.an { border-color: var(--blau-d); color: var(--tinte); background: #e6f7fe; }
  .karten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(760px, 100%); }
  .karte { border: 0; border-radius: 30px; padding: 18px 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: 0 8px 0 var(--d), 0 14px 24px rgba(120, 80, 20, .15); background: var(--f); transition: transform .1s; min-height: 190px; justify-content: center; }
  .karte:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--d); }
  .karte.gelb { --f: var(--gelb); --d: var(--gelb-d); } .karte.blau { --f: var(--blau); --d: var(--blau-d); } .karte.gruen { --f: var(--gruen); --d: var(--gruen-d); }
  .karte .bild { font-size: 58px; line-height: 1; }
  .karte .buchst { height: 44px; color: var(--tinte); }
  .karte b { font-size: 19px; font-weight: 900; }
  .karte small { font-size: 15px; font-weight: 800; min-height: 18px; }
  .hinweis { margin: 0; max-width: 520px; text-align: center; font-size: 14px; color: var(--sanft); line-height: 1.4; }
  @media (max-width: 560px) { .karten { grid-template-columns: 1fr; max-width: 380px; } .karte { flex-direction: row; min-height: 0; padding: 14px 18px; gap: 14px; justify-content: flex-start; }
    .karte .bild { font-size: 46px; } .karte .buchst { height: 36px; } .karte b { flex: 1; text-align: left; font-size: 21px; } }

  /* ---- Leiste oben in den Spielen ---- */
  .leiste { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 8px; }
  .leiste .punkte { flex: 1; display: flex; justify-content: center; gap: 8px; }
  .punkte span { width: 16px; height: 16px; border-radius: 50%; background: var(--rand); transition: background .2s, transform .2s; }
  .punkte span.voll { background: var(--gelb-d); transform: scale(1.15); }
  .rund { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--karte); font-size: 26px; box-shadow: 0 4px 0 var(--rand); flex: none; }
  .rund:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rand); }

  /* ---- Antwortknoepfe ---- */
  .optionen { width: 100%; max-width: 640px; display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .optionen.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 700px) { .optionen.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .opt { height: clamp(96px, 16vh, 140px); border: 3px solid var(--rand); background: var(--karte); border-radius: 26px; padding: 16px 10px;
    box-shadow: 0 7px 0 var(--rand); display: flex; align-items: center; justify-content: center; transition: transform .1s, background .2s, opacity .2s; }
  .opt:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--rand); }
  .opt.richtig { background: var(--gut); border-color: var(--gut-d); box-shadow: 0 7px 0 var(--gut-d); color: #fff; animation: huepf .5s; }
  .opt.falsch, .opt:disabled { opacity: .35; animation: wackel .4s; }
  .opt .buchst-svg { height: 100%; max-width: 100%; }
  .zahlen .opt { font-size: clamp(52px, 13vw, 76px); font-weight: 900; padding: 0; }
  @keyframes wackel { 20%, 60% { transform: translateX(-8px) } 40%, 80% { transform: translateX(8px) } }
  @keyframes huepf { 40% { transform: scale(1.08) } }

  /* ---- Anlaute ---- */
  .bildkarte { width: min(62vw, 34vh, 240px); aspect-ratio: 1; border: 0; border-radius: 36px; background: var(--karte); box-shadow: 0 8px 0 var(--rand), 0 16px 30px rgba(120, 80, 20, .12);
    font-size: min(36vw, 20vh, 150px); line-height: 1; display: flex; align-items: center; justify-content: center; margin-top: 4px; }
  .bildkarte:active { transform: scale(.97); }
  .wort { font-size: clamp(34px, 9vw, 52px); font-weight: 900; min-height: 1.2em; letter-spacing: .03em; }
  .wort .erster { color: #ff7a2f; }
  .wort.klein { font-size: clamp(24px, 6vw, 34px); display: flex; align-items: center; gap: 10px; }
  .wort .emo { font-size: 1.3em; }

  /* ---- Nachspuren ---- */
  .abc { width: 100%; max-width: 760px; display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; touch-action: pan-x; scrollbar-width: none; flex: none; }
  .abc::-webkit-scrollbar { display: none; }
  .abc button { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 2px solid var(--rand); background: var(--karte); font-size: 22px; font-weight: 900; color: var(--sanft); }
  .abc button.an { background: var(--blau); border-color: var(--blau-d); color: var(--tinte); }
  #spFlaeche { flex: 1; width: 100%; max-width: 760px; min-height: 220px; position: relative; border-radius: 30px; background: var(--karte); box-shadow: 0 8px 0 var(--rand); overflow: hidden; }
  #spCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  /* ---- Rechnen ---- */
  .bilder { width: 100%; max-width: 760px; min-height: 150px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; margin-top: 6px; }
  .gruppe { display: grid; gap: 4px; padding: 10px; border-radius: 24px; background: var(--karte); box-shadow: 0 6px 0 var(--rand); }
  .ding { border: 0; background: none; padding: 0; font-size: var(--g, 44px); line-height: 1.15; position: relative; transition: transform .25s, opacity .4s; }
  .ding.gezaehlt::after { content: attr(data-n); position: absolute; right: -4px; top: -6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--blau-d); color: #fff; font: 900 15px/24px system-ui, sans-serif; text-align: center; }
  .ding.fort { opacity: .3; transform: translateY(-6px) scale(.9); }
  .ding.fort::before { content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 5px; margin-top: -2px; background: #e5484d; border-radius: 3px; transform: rotate(-35deg); }
  .zeichen { font-size: clamp(44px, 11vw, 64px); font-weight: 900; color: var(--sanft); }
  .aufgabe { font-size: clamp(46px, 13vw, 76px); font-weight: 900; letter-spacing: .04em; }
  .aufgabe .frage { color: #ff7a2f; }
  .aufgabe .loesung { color: var(--gut-d); }

  /* ---- Belohnung ---- */
  #belohnung { justify-content: center; }
  .stern { font-size: min(44vw, 200px); line-height: 1; animation: drehen 1.2s ease-out; }
  .tier { font-size: min(22vw, 96px); animation: tanzen 1s ease-in-out infinite alternate; }
  .zahl { font-size: 36px; font-weight: 900; }
  .zeile { display: flex; gap: 16px; }
  .gross { width: 120px; height: 96px; border-radius: 28px; border: 0; font-size: 46px; background: var(--karte); box-shadow: 0 7px 0 var(--rand); }
  .gross.gelb { background: var(--gelb); box-shadow: 0 7px 0 var(--gelb-d); }
  .gross:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--rand); }
  @keyframes drehen { 0% { transform: scale(.2) rotate(-200deg); opacity: 0 } 70% { transform: scale(1.15) rotate(10deg); opacity: 1 } 100% { transform: scale(1) rotate(0) } }
  @keyframes tanzen { from { transform: rotate(-12deg) translateY(0) } to { transform: rotate(12deg) translateY(-14px) } }

  /* ---- Startseite: Kopf, neue und leichte Spiele ---- */
  .hub-kopf { display: flex; align-items: center; gap: 6px; }
  .hub-mampfi { width: clamp(86px, 24vw, 140px); }
  .leicht { margin: 6px 0 -4px; font-size: 15px; color: var(--sanft); font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .karte.orange { --f: #ffc78f; --d: #e8964a; } .karte.rosa { --f: #ffc4d6; --d: #e58aa3; } .karte.lila { --f: #dccbff; --d: #a58be6; }
  .karten.klein .karte { min-height: 112px; padding: 10px 6px; } .karten.klein .karte .bild { font-size: 38px; } .karten.klein .karte b { font-size: 15px; }
  .karten.klein .karte .buchst { height: 30px; }
  .mini-m { display: inline-block; width: 64px; vertical-align: bottom; }
  #kEinst { padding: 10px 14px; }
  @media (max-width: 560px) {
    .karten.klein { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .karten.klein .karte { flex-direction: column; padding: 10px 4px; gap: 4px; justify-content: center; }
    .karten.klein .karte b { flex: none; text-align: center; font-size: 13px; }
    .karten.klein .karte .bild { font-size: 30px; } .karten.klein .karte .buchst { height: 24px; }
    .mini-m { width: 52px; }
  }

  /* ---- Mampfi ---- */
  .mampfi { position: relative; cursor: pointer; flex: none; }
  .mampfi svg { display: block; width: 100%; height: auto; overflow: visible; }
  .mampfi .m-koerper { transform-box: view-box; transform-origin: 100px 196px; }
  .mampfi .m-augen { transform-box: view-box; transform-origin: 100px 92px; animation: blinzeln 4.6s infinite; }
  .mampfi .m-arm-l { transform-box: view-box; transform-origin: 44px 108px; transition: transform .2s; }
  .mampfi .m-arm-r { transform-box: view-box; transform-origin: 156px 108px; transition: transform .2s; }
  .mampfi .m-pupillen { transition: transform .2s; }
  .mampfi .m-brauen, .mampfi .m-mund-auf, .mampfi .m-mund-schief, .mampfi .m-backen { opacity: 0; }
  .mampfi.m-offen .m-mund-auf, .mampfi.m-freut .m-mund-auf, .mampfi.m-tanzt .m-mund-auf, .mampfi.m-ruelpst .m-mund-auf { opacity: 1; }
  .mampfi.m-offen .m-mund-zu, .mampfi.m-freut .m-mund-zu, .mampfi.m-tanzt .m-mund-zu, .mampfi.m-ruelpst .m-mund-zu, .mampfi.m-verwirrt .m-mund-zu { opacity: 0; }
  .mampfi.m-kaut .m-mund-auf { animation: kauA .26s steps(1) infinite; } .mampfi.m-kaut .m-mund-zu { animation: kauB .26s steps(1) infinite; }
  .mampfi.m-kaut .m-koerper { animation: kauWackel .26s infinite; }
  .mampfi.m-freut .m-koerper { animation: freuHuepf .45s ease-in-out 3; }
  .mampfi.m-freut .m-arm-l, .mampfi.m-tanzt .m-arm-l { transform: rotate(115deg); } .mampfi.m-freut .m-arm-r, .mampfi.m-tanzt .m-arm-r { transform: rotate(-115deg); }
  .mampfi.m-tanzt .m-koerper { animation: tanzen2 .42s ease-in-out infinite alternate; }
  .mampfi.m-verwirrt .m-brauen, .mampfi.m-verwirrt .m-mund-schief { opacity: 1; }
  .mampfi.m-verwirrt .m-koerper { animation: wackel .5s; } .mampfi.m-verwirrt .m-pupillen { transform: translate(-4px, -4px); }
  .mampfi.m-ruelpst .m-backen { opacity: 1; } .mampfi.m-ruelpst .m-koerper { animation: ruelpsen .8s; }
  .m-blase { position: absolute; left: 50%; bottom: 96%; transform: translateX(-50%); background: #fff; border: 3px solid var(--tinte); border-radius: 18px;
    padding: 6px 12px; font-weight: 900; font-size: 15px; white-space: nowrap; z-index: 5; box-shadow: 0 4px 0 rgba(0, 0, 0, .08); animation: blaseRein .25s; pointer-events: none; }
  .m-blase::after { content: ""; position: absolute; left: 50%; top: 100%; border: 8px solid transparent; border-top-color: var(--tinte); transform: translateX(-50%); }
  @keyframes blinzeln { 0%, 95%, 100% { transform: scaleY(1) } 97% { transform: scaleY(.1) } }
  @keyframes kauA { 0% { opacity: 1 } 50% { opacity: 0 } }
  @keyframes kauB { 0% { opacity: 0 } 50% { opacity: 1 } }
  @keyframes kauWackel { 50% { transform: scale(1.04, .96) } }
  @keyframes freuHuepf { 50% { transform: translateY(-20px) } }
  @keyframes tanzen2 { from { transform: rotate(-10deg) } to { transform: rotate(10deg) } }
  @keyframes ruelpsen { 20% { transform: scale(1.14, .88) } 45% { transform: scale(.94, 1.07) } }
  @keyframes blaseRein { from { transform: translateX(-50%) scale(.6); opacity: 0 } }
  .flieger { position: fixed; z-index: 60; pointer-events: none; display: flex; align-items: center; justify-content: center; line-height: 1; }

  /* ---- Gemeinsam fuer die neuen Spiele ---- */
  .szene { display: flex; align-items: flex-end; justify-content: center; gap: 16px; width: 100%; max-width: 680px; }
  .mampfi-s { width: min(32vw, 150px); }
  .bildkarte.klein { width: min(38vw, 22vh, 170px); font-size: min(24vw, 13vh, 110px); margin: 0; }
  .bildkarte.weg-geflogen { font-size: 0 !important; }
  .geschichte { font-size: clamp(17px, 4.6vw, 23px); font-weight: 800; text-align: center; max-width: 620px; line-height: 1.35; min-height: 2.7em; display: flex; align-items: center; justify-content: center; }
  .opt.wackelt { animation: wackel .4s; }

  /* ---- Woerter bauen ---- */
  .felder { display: flex; gap: 6px; justify-content: center; width: 100%; max-width: 680px; }
  .feld { width: min(58px, calc((100vw - 32px - (var(--n) - 1) * 6px) / var(--n))); height: 72px; border-bottom: 5px solid var(--rand); border-radius: 12px 12px 6px 6px;
    background: rgba(255, 255, 255, .65); display: flex; align-items: center; justify-content: center; padding: 6px 2px; }
  .feld .buchst-svg { height: 100%; max-width: 100%; }
  .feld.voll { border-color: var(--gut); background: #effbe6; animation: huepf .3s; }
  .felder.geschafft .feld { animation: huepf .5s; background: #dff7cf; }
  .karten-box { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; max-width: 680px; }
  .karte-b { width: 66px; height: 78px; border-radius: 18px; border: 3px solid var(--rand); background: var(--karte); box-shadow: 0 5px 0 var(--rand);
    padding: 7px; display: flex; align-items: center; justify-content: center; transition: transform .1s; }
  .karte-b:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--rand); }
  .karte-b .buchst-svg { height: 100%; max-width: 100%; }
  .karte-b.benutzt { visibility: hidden; }
  .karte-b.wackelt { animation: wackel .4s; border-color: var(--rot); }
  .karte-b.tipp { animation: leuchten .9s infinite; border-color: var(--gelb-d); }
  .karte-b.gedrueckt { background: #e6f7fe; }
  .karten-box.tastatur { gap: 6px; } .karten-box.tastatur .karte-b { width: 44px; height: 54px; padding: 5px; border-radius: 12px; box-shadow: 0 4px 0 var(--rand); }
  @keyframes leuchten { 50% { box-shadow: 0 0 0 7px rgba(255, 210, 92, .75), 0 5px 0 var(--rand); transform: scale(1.06); } }
  .uebers-zeile { min-height: 50px; }
  .uebers { border: 3px solid var(--rand); background: var(--karte); border-radius: 999px; padding: 8px 18px; font-size: 21px; font-weight: 900; }

  /* ---- Mampfi fuettern ---- */
  .zehnerfelder { display: flex; flex-direction: column; gap: 8px; }
  .zehner { --zelle: clamp(30px, 10vw, 54px); display: grid; grid-template-columns: repeat(5, var(--zelle)); grid-auto-rows: var(--zelle); gap: 3px; padding: 6px;
    background: var(--karte); border-radius: 16px; box-shadow: 0 5px 0 var(--rand); }
  .zelle { border: 2px dashed #ecdcbc; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .zelle .ding { font-size: calc(var(--zelle) * .7); line-height: 1; }
  .zelle.kruemel::after { content: "·"; color: #c9a86b; font-size: 26px; font-weight: 900; }
  .zelle.kruemel .ding { display: none; }
  .ding.neu { animation: reinPlopp .35s; }
  @keyframes reinPlopp { from { transform: translateY(-24px) scale(0) } 70% { transform: scale(1.2) } }
  .mampfi-s.mampfi-gross { width: min(25vw, 170px); align-self: center; }

  /* ---- Uhr ---- */
  .uhr-szene { position: relative; width: min(84vw, 50vh, 430px); flex: none; }
  .uhr-box svg { width: 100%; height: auto; display: block; touch-action: none; overflow: visible; }
  .uhr-box .uh-minuten { opacity: 0; transition: opacity .3s; } .uhr-box.mit-minuten .uh-minuten { opacity: 1; }
  .uhr-box.stellbar svg { cursor: grab; }
  .zeiger.aktiv line { filter: drop-shadow(0 0 6px rgba(63, 169, 214, .9)); }
  .zeiger.blinkt { animation: zblink .4s 4; } @keyframes zblink { 50% { opacity: .15 } }
  #uhMampfi { position: absolute; right: -8%; bottom: -6%; width: 27%; }
  .digital { font-size: clamp(19px, 5vw, 27px); font-weight: 900; color: var(--gut-d); min-height: 1.3em; text-align: center; }
  .optionen.n1 { grid-template-columns: minmax(0, 230px); justify-content: center; }
  .optionen.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .optionen.uhr-text .opt { font-size: clamp(16px, 4.4vw, 24px); font-weight: 900; padding: 8px; height: clamp(84px, 13vh, 120px); line-height: 1.2; }
  .fertig-knopf { font-size: 54px; font-weight: 900; background: var(--gelb); border-color: var(--gelb-d); box-shadow: 0 7px 0 var(--gelb-d); }

  /* ---- Einstellungen ---- */
  h2 { margin: 0; font-size: 28px; font-weight: 900; }
  .ein-box { width: min(580px, 100%); background: var(--karte); border-radius: 24px; padding: 14px 18px; box-shadow: 0 6px 0 var(--rand); }
  .ein-box h3 { margin: 10px 0 4px; font-size: 18px; }
  .ein-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 8px 0; font-size: 16px; }
  .ein-zeile select { flex: 1; min-width: 170px; font: inherit; padding: 8px; border-radius: 12px; border: 2px solid var(--rand); background: #fff; color: var(--tinte); }
  .ein-zeile input[type=range] { flex: 1; min-width: 150px; }
  .ein-zeile small { width: 100%; color: var(--sanft); }
  .ein-zeile input[type=radio] { flex: none; width: 22px; height: 22px; margin: 0; } .ein-zeile span { flex: 1; }

  /* ---- Konfetti ---- */
  #konfetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .kf { position: absolute; width: 10px; height: 14px; border-radius: 3px; animation-timing-function: cubic-bezier(.2, .7, .4, 1); animation-fill-mode: forwards; }
  .kf.stern { width: auto; height: auto; font-size: 22px; background: none; }
  @keyframes fallen { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: .2 } }
  @keyframes platzen { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0 } }
</style>
</head>
<body>

<!-- Startseite -->
<section id="hub" class="schirm">
  <div class="hub-kopf"><div id="hubMampfi" class="hub-mampfi" aria-label="Mampfi"></div><h1><span>L</span><span>e</span><span>r</span><span>n</span><span>e</span><span>n</span></h1></div>
  <div class="sprachen">
    <button class="spr an" data-spr="de">🇩🇪 Deutsch</button>
    <button class="spr" data-spr="en">🇬🇧 English</button>
    <button class="spr" id="kEinst" aria-label="Einstellungen">⚙️</button>
  </div>
  <div class="karten">
    <button class="karte orange" id="kBauen"><span class="bild">🧩</span><span class="buchst" id="kBauenSvg"></span><b>Wörter bauen</b><small class="sterne" data-spiel="bauen"></small></button>
    <button class="karte rosa" id="kFuettern"><span class="bild"><span id="fuMini" class="mini-m"></span>🍪</span><b>Mampfi füttern</b><small class="sterne" data-spiel="fuettern"></small></button>
    <button class="karte lila" id="kUhr"><span class="bild">🕒</span><b>Uhr</b><small class="sterne" data-spiel="uhr"></small></button>
  </div>
  <h2 class="leicht">Leicht</h2>
  <div class="karten klein">
    <button class="karte gelb" id="kAnlaut"><span class="bild">🐭</span><span class="buchst" id="kAnlautSvg"></span><b>Anlaute</b><small class="sterne" data-spiel="anlaut"></small></button>
    <button class="karte blau" id="kSpuren"><span class="bild">✏️</span><b>Nachspuren</b><small class="sterne" data-spiel="spuren"></small></button>
    <button class="karte gruen" id="kRechnen"><span class="bild">🍎+🍎</span><b>Rechnen</b><small class="sterne" data-spiel="rechnen"></small></button>
  </div>
  <p class="hinweis" id="stimmeHinweis"></p>
</section>

<!-- Anlaute: Bild hoeren, Anfangsbuchstaben antippen -->
<section id="anlaut" class="schirm weg">
  <div class="leiste"><button class="rund heim" aria-label="Zur Übersicht">🏠</button><div class="punkte"></div><button class="rund hoeren" aria-label="Nochmal hören">🔊</button></div>
  <button id="anBild" class="bildkarte" aria-label="Wort hören"></button>
  <div id="anWort" class="wort">&nbsp;</div>
  <div id="anOpt" class="optionen"></div>
</section>

<!-- Nachspuren: Buchstaben mit dem Finger nachfahren -->
<section id="spuren" class="schirm weg">
  <div class="leiste"><button class="rund heim" aria-label="Zur Übersicht">🏠</button><div class="punkte"></div><button class="rund" id="spNeu" aria-label="Von vorne">↺</button><button class="rund hoeren" aria-label="Nochmal hören">🔊</button></div>
  <div id="spLeiste" class="abc"></div>
  <div id="spFlaeche"><canvas id="spCv"></canvas></div>
  <div id="spWort" class="wort klein">&nbsp;</div>
</section>

<!-- Rechnen bis 10 mit Bildern -->
<section id="rechnen" class="schirm weg">
  <div class="leiste"><button class="rund heim" aria-label="Zur Übersicht">🏠</button><div class="punkte"></div><button class="rund hoeren" aria-label="Nochmal hören">🔊</button></div>
  <div id="reBilder" class="bilder"></div>
  <div id="reAufgabe" class="aufgabe"></div>
  <div id="reOpt" class="optionen zahlen"></div>
</section>

<!-- Woerter bauen: Bild + Wort hoeren, Buchstaben in die richtige Reihenfolge tippen -->
<section id="bauen" class="schirm weg">
  <div class="leiste"><button class="rund heim" aria-label="Zur Übersicht">🏠</button><div class="punkte"></div><button class="rund hoeren" aria-label="Nochmal hören">🔊</button></div>
  <div class="szene"><div id="baMampfi" class="mampfi-s"></div><button id="baBild" class="bildkarte klein" aria-label="Wort hören"></button></div>
  <div id="baText" class="geschichte"></div>
  <div id="baFelder" class="felder"></div>
  <div id="baKarten" class="karten-box"></div>
  <div id="baUebers" class="uebers-zeile">&nbsp;</div>
</section>

<!-- Mampfi fuettern: Rechengeschichten mit Zehnerfeldern -->
<section id="fuettern" class="schirm weg">
  <div class="leiste"><button class="rund heim" aria-label="Zur Übersicht">🏠</button><div class="punkte"></div><button class="rund hoeren" aria-label="Nochmal hören">🔊</button></div>
  <div id="fuText" class="geschichte"></div>
  <div class="szene"><div id="fuMampfi" class="mampfi-s mampfi-gross"></div><div id="fuFelder" class="zehnerfelder"></div></div>
  <div id="fuAufgabe" class="aufgabe">&nbsp;</div>
  <div id="fuOpt" class="optionen zahlen"></div>
</section>

<!-- Uhr: Zeiger stellen oder Uhrzeit ablesen -->
<section id="uhr" class="schirm weg">
  <div class="leiste"><button class="rund heim" aria-label="Zur Übersicht">🏠</button><div class="punkte"></div><button class="rund hoeren" aria-label="Nochmal hören">🔊</button></div>
  <div id="uhText" class="geschichte"></div>
  <div class="uhr-szene"><div id="uhUhr" class="uhr-box"></div><div id="uhMampfi"></div></div>
  <div id="uhDigital" class="digital">&nbsp;</div>
  <div id="uhOpt" class="optionen"></div>
</section>

<!-- Einstellungen fuer Eltern -->
<section id="einstellungen" class="schirm weg">
  <div class="leiste"><button class="rund heim" aria-label="Zur Übersicht">🏠</button><div class="punkte"></div></div>
  <h2>Einstellungen</h2>
  <div class="ein-box">
    <h3>Stimme</h3>
    <div id="einStimmen"></div>
    <label class="ein-zeile"><b>Tempo</b><input type="range" id="einTempo" min="0.6" max="1.2" step="0.02"></label>
    <h3>Uhrzeit sagen</h3>
    <label class="ein-zeile"><input type="radio" name="uhrstil" value="standard"><span>Viertel nach 3 · Viertel vor 4 · zwanzig nach 3</span></label>
    <label class="ein-zeile"><input type="radio" name="uhrstil" value="wien"><span>viertel 4 · dreiviertel 4 · zehn vor halb 4 (wienerisch)</span></label>
    <p class="hinweis">Gilt nur für dieses Gerät.</p>
  </div>
</section>

<!-- Belohnung nach einer Runde -->
<section id="belohnung" class="schirm weg">
  <div class="stern">⭐</div>
  <div id="beTier" class="tier"></div>
  <div id="beZahl" class="zahl"></div>
  <div class="zeile"><button class="gross gelb" id="beNochmal" aria-label="Nochmal">▶</button><button class="gross" id="beHeim" aria-label="Zur Übersicht">🏠</button></div>
</section>

<div id="konfetti"></div>

<!-- Klassische Skripte, keine Module. Reihenfolge: stimme -> schrift -> woerter -> mampfi -> Spiele -> lernen (startet alles) -->
<script src="js/stimme.js"></script>
<script src="js/schrift.js"></script>
<script src="js/woerter.js"></script>
<script src="js/mampfi.js"></script>
<script src="js/anlaut.js"></script>
<script src="js/spuren.js"></script>
<script src="js/rechnen.js"></script>
<script src="js/bauen.js"></script>
<script src="js/fuettern.js"></script>
<script src="js/uhr.js"></script>
<script src="js/lernen.js"></script>
<script src="../../zurueck.js"></script>
</body>
</html>
